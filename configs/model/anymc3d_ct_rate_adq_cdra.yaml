# @package _global_
model:
  _target_: model_arch.anymc3d.AnyMC3DLightningModule
  task: multilabel
  num_classes: 18
  modalities: [ct]
  backbone_name: dinov2_vitb14
  lora_rank: 8
  lora_alpha: 16
  input_size: 224
  cls_head_dropout: 0.1
  slice_axis: 3
  vision_blocks: 0
  mlp_ratio: 4.0
  block_dropout: 0.0
  use_slice_attn_pool: true
  use_patch_concat: false
  use_25d: false
  use_patch_attn_pool: false

  use_disease_queries: true
  consistency_weight: 0.1
  consistency_temperature: 1.0

  # CDRA: gated relational reasoning across all 18 disease embeddings.
  use_cross_disease_relation: true
  relation_heads: 8
  relation_dropout: 0.1

  # Low-LR one-epoch refinement from the trained ADQ-MR checkpoint.
  lora_lr: 1.0e-5
  lora_weight_decay: 1.0e-5
  vision_lr: 1.0e-5
  vision_weight_decay: 1.0e-5
  head_lr: 1.0e-4
  head_weight_decay: 1.0e-4
  warmup_epochs: 0
  lr_scheduler: constant

  focal_gamma: 2.0
  focal_alpha: 0.25

  max_epochs: 1
  seed: 2026
  precision: "bf16-mixed"
  early_stopping_patience: 8
  save_top_k: 1
  log_every_n_steps: 20

  devices: 1
  strategy: ddp
  num_nodes: 8
  sync_batchnorm: false

  project: "ct-rate-anymc3d"
  run_name: "ct_rate_adq_cdra_dinov2_vitb_96s_stage2_v1"
